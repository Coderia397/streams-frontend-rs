    <script>
      /* The form of the site before the first paint, by the same rule as src/form (phone: under 600 px wide, or a phone itself: a screen
         under 600 px on its short side used by touch, held either way; desktop from 1024 px; tablet between); the app keeps it current. */
      try {
        var mq = function (q) { return window.matchMedia(q).matches; };
        var mobile = navigator.userAgentData && typeof navigator.userAgentData.mobile === "boolean" ? navigator.userAgentData.mobile : /Mobi/.test(navigator.userAgent);
        var phoneDevice = Math.min(screen.width, screen.height) < 600 && (mq("(pointer: coarse)") || mobile);
        document.documentElement.setAttribute("data-form",
          mq("(max-width: 599.98px)") || phoneDevice ? "phone" : mq("(min-width: 1024px)") ? "desktop" : "tablet");
      } catch (e) {}
    </script>
    <script>
      /* The start animation is for the first visit and for a return after a long time. A visit within the last
         data-boot-quiet-minutes (set on <body>) never shows it. It also waits 1.2 s, so a quick start never shows it. */
      try {
        var seen = Number(localStorage.getItem("streams_boot_seen") || 0);
        var quiet = Number(document.documentElement.getAttribute("data-boot-quiet-minutes") || 360) * 60000;
        if (seen && Date.now() - seen < quiet) document.documentElement.classList.add("boot-skip");
      } catch (e) {}
    </script>
    <script>
      /* The profile switch on a phone or tablet continues across the reload that opens the profile: the page before it saved the picture, and this puts the same black screen, picture and
         turning arc up at once, before the app has started; the app (switch_overlay.rs, resume_compact_switch) then flies the picture to its place in the bar and takes the screen away. */
      (function () {
        try {
          var raw = sessionStorage.getItem("streams_sw_pending");
          if (!raw) return;
          sessionStorage.removeItem("streams_sw_pending");
          var p = JSON.parse(raw);
          if (!p || !p.a || Date.now() - p.t > 20000) return;
          document.documentElement.classList.add("boot-skip");
          var root = document.createElement("div");
          root.id = "sw-boot"; root.setAttribute("role", "status");
          root.setAttribute("style", "position:fixed;inset:0;z-index:2147483600;");
          root.innerHTML =
            '<div style="position:absolute;inset:0;background:#000;opacity:1;transition:opacity .42s ease-out .1s;"></div>' +
            '<div style="position:absolute;left:50%;top:50%;width:min(46vw,280px);height:min(46vw,280px);transform:translate(-50%,calc(-50% + min(50vw,300px)));opacity:1;transition:opacity .2s;"><svg style="width:100%;height:100%;animation:swspin .95s linear infinite" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="sw-boot-g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f6bff" stop-opacity="0"/><stop offset="1" stop-color="#2f6bff"/></linearGradient></defs><circle cx="50" cy="50" r="44" fill="none" stroke="url(#sw-boot-g)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="190 276"/></svg></div>' +
            '<div style="position:absolute;left:50%;top:44%;width:min(42vw,260px);height:min(42vw,260px);overflow:hidden;border-radius:10%;opacity:1;transform:translate(-50%,-50%);will-change:transform;"><img alt="" style="width:100%;height:100%;object-fit:cover;display:block;"></div>' +
            '<style>@keyframes swspin{to{transform:rotate(360deg)}}</style>';
          root.querySelector("img").setAttribute("src", p.a);
          document.documentElement.appendChild(root);
        } catch (e) {}
      })();
    </script>
    <style>
      html.boot-skip #boot{display:none}
      #boot{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;z-index:2147483000;background:#0b0b0c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;opacity:0;animation:bootin .25s ease 1.2s forwards}#boot.done{animation:bootout .2s ease forwards}@keyframes bootin{to{opacity:1}}@keyframes bootout{from{opacity:1}to{opacity:0}}
      #boot svg.mark{width:96px;height:96px}

      @media (prefers-reduced-motion:reduce){#boot .dots i{animation:none;opacity:.6}#boot,#boot.done{animation-duration:.01s}}

    <!-- Instant ambient color hydration before first paint (0ms) -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem("streams-ambient:last");
          var r = 16, g = 21, b = 25;
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && typeof parsed.r === 'number') {
              r = parsed.r; g = parsed.g; b = parsed.b;
            }
          }
          document.documentElement.style.setProperty('--ambient-r', r);
          document.documentElement.style.setProperty('--ambient-g', g);
          document.documentElement.style.setProperty('--ambient-b', b);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = 'rgb(' + Math.round(r * 0.45) + ',' + Math.round(g * 0.45) + ',' + Math.round(b * 0.45) + ')';
        } catch(e) {}
      })();
    </script>
