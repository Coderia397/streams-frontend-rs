[build]
target = "index.html"

[watch]
ignore = [
    "style/output.css",
    "public/sitemap.xml",
    "interop/dist",
    # another dev server's output (the desktop one writes dist/ while the phone one serves from elsewhere): without these, each
    # build of one server started a build of the other
    "dist",
    ".wrangler",
]

[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["-c", "python3 scripts/make_sitemap.py || true; sh scripts/apply_brand.sh && sh scripts/build_interop.sh && ./tailwindcss -i ./style/input.css -o ./style/output.css"]

[serve]
port = 8080
open = false

