[package]
name = "streams-frontend-rs"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[[bin]]
name = "streams-frontend-rs"
path = "src/main.rs"

[dependencies]
console_error_panic_hook = "0.1.7"
gloo-net = "0.7.0"
js-sys = "0.3"
leptos = { version = "0.8.20", features = ["csr"] }
leptos_router = "0.8.15"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
fluent-bundle = "0.16"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
unic-langid = "0.9"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlVideoElement",
    "HtmlMediaElement",
    "Window",
    "StorageEvent",
    "MediaError",
    "EventTarget",
    "DomRect",
    "Storage",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "CssStyleDeclaration",
    "Navigator",
    "Clipboard",
    "FocusEvent",
    "Node",
    "HtmlSelectElement",
    "Location",
    "AbortController",
    "AbortSignal",
    "RequestMode",
    "Performance",
    "History",
    "MediaQueryList",
    "PointerEvent",
    "AddEventListenerOptions",
    "Element",
    "Screen",
    "File",
    "FileList",
    "Blob",
    "ScrollToOptions",
    "NodeList",
    "ScrollBehavior",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "HtmlDocument",
] }

[profile.release]
lto = true
opt-level = 'z'
codegen-units = 1
panic = "abort"


[profile.dev]
opt-level = 0
debug = 0

# Quick builds for the phone while editing (trunk serve --cargo-profile phone --address 0.0.0.0): no whole program optimisation, parallel and incremental, so an edit rebuilds in well under a minute
[profile.phone]
inherits = "release"
lto = false
opt-level = "s"
codegen-units = 16
incremental = true
panic = "abort"
